name: daily-brief

on:
  schedule:
    # GitHub Actions cron is ALWAYS in UTC.
    # Convert your local send time to UTC.
    #   7:00 AM Sri Lanka (UTC+5:30) = 01:30 UTC  -> "30 1 * * 1-5"
    #   7:00 AM US Eastern (UTC-4)    = 11:00 UTC  -> "0 11 * * 1-5"
    # 1-5 = Monday through Friday.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:   # lets you trigger a manual test run from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python brief.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
